<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="FOU Logistics">
  <!-- PLACEHOLDER MARK — replace this file with the real FOU logo.
       Reads as an "F" built from motion lines. Keep the 48×48 viewBox and
       it will drop straight into the header, footer and trailer livery. -->
  <defs>
    <linearGradient id="fou-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#d9500e"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#fou-mark)"/>
  <g fill="#fff">
    <rect x="11" y="12" width="6" height="24" rx="2"/>
    <rect x="11" y="12" width="25" height="6" rx="2"/>
    <rect x="11" y="21" width="17" height="6" rx="2"/>
    <rect x="21" y="30" width="13" height="6" rx="2" opacity=".5"/>
  </g>
</svg>
